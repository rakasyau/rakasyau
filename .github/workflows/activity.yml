name: Update profile activity

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/activity.yml
  workflow_dispatch:
  schedule:
    - cron: '21 3 * * *'

concurrency:
  group: profile-activity-${{ github.ref }}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create the output directory
        run: mkdir -p assets

      - name: Generate GitHub statistics
        uses: cicirello/user-statistician@930471d1b15a16ae11f80d755c411aa943039f49 # v1.22.0
        with:
          image-file: assets/github-stats.svg
          custom-title: Raka's GitHub Stats
          colors: dark-dimmed
          locale: en
          hide-keys: general, private
          max-languages: 5
          commit-and-push: 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish updated activity images
        run: |
          git add -- assets/github-stats.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update GitHub profile activity'
          git push
